<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sc-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#5CC8B8"/>
    </linearGradient>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-plate { fill: #0B1B2B; }
    .border-ring { stroke: url(#sc-teal-grad); stroke-width: 1.5; stroke-opacity: 0.85; }
    .monogram { fill: #F6F5F1; }
    .live-dot { fill: #5CC8B8; }
    .live-halo { fill: #5CC8B8; fill-opacity: 0.25; }
    
    @media (prefers-color-scheme: dark) {
      .bg-plate { fill: #0B1B2B; }
      .border-ring { stroke: #5CC8B8; stroke-width: 1.8; stroke-opacity: 0.95; }
      .monogram { fill: #FFFFFF; }
    }
  </style>

  <!-- Background Base (Architectural Squircle) -->
  <rect class="bg-plate" x="2" y="2" width="60" height="60" rx="15" />
  
  <!-- Subtle Glowing Inner Border -->
  <rect class="border-ring" x="3" y="3" width="58" height="58" rx="14" fill="none" />

  <!-- Signature Live Systems Pulse Beacon -->
  <circle class="live-halo" cx="49" cy="15" r="4.5" />
  <circle class="live-dot" cx="49" cy="15" r="2.5" />

